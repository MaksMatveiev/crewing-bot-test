<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Нос судна на волне">
  <!-- Значок агентства: нос судна, развёрнутый на зрителя.
       Без мачты с реем: на 16 пикселях рей читался как крест, и весь
       значок превращался в якорь. Борта нарисованы двумя фигурами —
       зазор между ними и есть форштевень. -->
  <circle cx="32" cy="32" r="32" fill="#4ea3cc"/>
  <g fill="#ffffff">
    <!-- Палубная надстройка -->
    <path d="M26 14h12a2 2 0 0 1 2 2v6H24v-6a2 2 0 0 1 2-2z"/>

    <!-- Левый борт: от широкого планширя вниз к форштевню -->
    <path d="M12 26h19v29l-5.4-3.3a15 15 0 0 1-6.4-8.2L12 26z"/>
    <!-- Правый борт -->
    <path d="M52 26H33v29l5.4-3.3a15 15 0 0 0 6.4-8.2L52 26z"/>

    <!-- Бурун у бортов -->
    <path d="M7 41.5c4.8.7 8.6 3.3 11.4 7.8-4.8.8-8.6 0-11.5-2.6-1.3-1.2-1.9-2.7-1.6-4.1.6.1 1.2.1 1.7-.1z"/>
    <path d="M57 41.5c-4.8.7-8.6 3.3-11.4 7.8 4.8.8 8.6 0 11.5-2.6 1.3-1.2 1.9-2.7 1.6-4.1-.6.1-1.2.1-1.7-.1z"/>
  </g>
</svg>
